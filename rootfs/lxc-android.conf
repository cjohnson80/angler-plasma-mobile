# LXC Container Configuration for Android 8.1 HAL Container
# Device: Huawei Nexus 6P (angler) - MSM8994

lxc.uts.name = android
lxc.rootfs.path = dir:/var/lib/lxc/android/rootfs

# Environment & Initializer
lxc.init.cmd = /init

# Container permissions
lxc.autodev = 0
lxc.pty.max = 1024

# CGroups & Privileges
lxc.cgroup.devices.allow = a

# Mounts required by Android hardware services and Bionic runtime
lxc.mount.entry = /dev/binder dev/binder none bind,create=file 0 0
lxc.mount.entry = /dev/hwbinder dev/hwbinder none bind,create=file 0 0
lxc.mount.entry = /dev/vndbinder dev/vndbinder none bind,create=file 0 0
lxc.mount.entry = /dev/ashmem dev/ashmem none bind,create=file 0 0
lxc.mount.entry = /dev/ion dev/ion none bind,create=file 0 0
lxc.mount.entry = /dev/kgsl-3d0 dev/kgsl-3d0 none bind,create=file 0 0
lxc.mount.entry = /sys sys none rbind 0 0
lxc.mount.entry = /proc proc none rbind 0 0

# Network passthrough
lxc.net.0.type = none
